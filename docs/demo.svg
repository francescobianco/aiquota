@keyframes old{0%,8%{opacity:1}9%,100%{opacity:0}}
@keyframes new{0%,8%{opacity:0}9%,97%{opacity:1}100%{opacity:0}}
@keyframes ring{0%,8%{opacity:0}10%,24%{opacity:1}30%,100%{opacity:0}}
