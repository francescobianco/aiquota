<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 334" width="920" height="334" role="img" aria-labelledby="t d">
<title id="t">AIQuota demo</title>
<desc id="d">A terminal opens. The title bar shows the quota left on each subscription, and a uniform band shows one section per account with a traffic-light dot. The aiquota command lists plans, bars and reset times. ChatGPT is low, so the user opens Claude.</desc>
